name: Modpack

# Builds the mod and packs it as a Modrinth modpack (.mrpack), published as an artifact and on the mrpack branch.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  mrpack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Pack
        run: python3 tools/make_mrpack.py publish

      - name: Upload modpack
        uses: actions/upload-artifact@v4
        with:
          name: grandline-mrpack
          path: publish/*.mrpack
          if-no-files-found: error

      - name: Publish to the mrpack branch
        run: |
          cp build/libs/grandline-*.jar publish/
          rm -f publish/*-sources.jar
          cd publish
          git init -q
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -b mrpack
          git add -A
          git commit -qm "Modpack for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" mrpack
